<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalogue | Page Turner Books</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <h1>Catalogue</h1>
    <form th:action="@{/books}" method="get" class="search">
        <input type="text" name="q" th:value="${q}" placeholder="Search by title, author or category">
        <button type="submit">Search</button>
    </form>

    <p th:if="${#lists.isEmpty(books)}" class="muted">No books matched your search.</p>

    <div class="grid">
        <div th:each="book : ${books}" th:replace="~{fragments/layout :: bookCard(${book})}"></div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
